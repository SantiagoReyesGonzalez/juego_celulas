<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2310b981'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Bacteria - Etapa 0 (Fundación)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #060913;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #telemetry-hud {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #e2e8f0;
        background: rgba(6, 9, 19, 0.75);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.6;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .hud-title {
        font-weight: 700;
        font-size: 14px;
        color: #10b981;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hud-badge {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .hud-stat {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .hud-label {
        color: #94a3b8;
      }
      .hud-value {
        font-weight: 600;
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #94a3b8;
        font-size: 13px;
        background: rgba(6, 9, 19, 0.6);
        padding: 8px 18px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="telemetry-hud">
      <div class="hud-title">
        <span class="hud-badge"></span>
        Proyecto Bacteria: Etapa 0
      </div>
      <div class="hud-stat">
        <span class="hud-label">FPS:</span>
        <span id="fps-val" class="hud-value">--</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Física (Rapier WASM):</span>
        <span id="wasm-status" class="hud-value">Iniciando...</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Cursor Mundial:</span>
        <span id="coords-val" class="hud-value">(0.0, 0.0)</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Velocidad Célula:</span>
        <span id="speed-val" class="hud-value">0.0 u/s</span>
      </div>
    </div>

    <div id="instructions">
      <b>W / Clic Der:</b> Propulsión &nbsp;|&nbsp; 
      <b>S:</b> Freno &nbsp;|&nbsp; 
      <b>Clic Izq / Espacio:</b> Toxina (retroceso) &nbsp;|&nbsp; 
      <b>B:</b> Alternar eritrocitos fondo
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
