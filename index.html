<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2310b981'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Bacteria - Etapa 0 (Fundación)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #060913;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #telemetry-hud {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #e2e8f0;
        background: rgba(6, 9, 19, 0.75);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.6;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .hud-title {
        font-weight: 700;
        font-size: 14px;
        color: #10b981;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hud-badge {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .hud-stat {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .hud-label {
        color: #94a3b8;
      }
      .hud-value {
        font-weight: 600;
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
      }
      #cellular-meters {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 10;
        pointer-events: none;
      }
      .meter-card {
        background: rgba(6, 9, 19, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 8px 14px;
        min-width: 170px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      }
      .meter-header {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .hp-card .meter-title { color: #10b981; }
      .shield-card .meter-title { color: #38bdf8; }
      .atp-card .meter-title { color: #fbbf24; }
      .threat-card .meter-title { color: #f43f5e; }
      .meter-num {
        color: #f1f5f9;
        font-variant-numeric: tabular-nums;
      }
      .meter-track {
        width: 100%;
        height: 7px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .hp-fill {
        background: linear-gradient(90deg, #059669, #10b981);
        box-shadow: 0 0 8px #10b981;
      }
      .shield-fill {
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        box-shadow: 0 0 8px #38bdf8;
      }
      .atp-fill {
        background: linear-gradient(90deg, #d97706, #fbbf24);
        box-shadow: 0 0 10px #fbbf24;
      }
      .threat-fill {
        background: linear-gradient(90deg, #10b981, #f59e0b);
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      }

      /* Banner de Mitosis */
      .mitosis-alert {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(217, 119, 6, 0.95);
        border: 2px solid #fef08a;
        border-radius: 30px;
        padding: 8px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ffffff;
        font-size: 13px;
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
        animation: pulseMitosis 1.5s infinite alternate;
        z-index: 100;
        pointer-events: auto;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .mitosis-alert:hover {
        transform: translateX(-50%) scale(1.06);
        box-shadow: 0 0 35px rgba(250, 204, 21, 1.0);
      }
      .mitosis-alert.hidden {
        display: none;
      }
      @keyframes pulseMitosis {
        from { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.5); }
        to { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(250, 204, 21, 1); }
      }

      /* Banner de Alerta Inmunológica */
      .threat-alert {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(159, 18, 57, 0.95);
        border: 2px solid #fda4af;
        border-radius: 30px;
        padding: 8px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ffffff;
        font-size: 13px;
        box-shadow: 0 0 25px rgba(244, 63, 94, 0.8);
        animation: pulseThreat 1.2s infinite alternate;
        z-index: 99;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .threat-alert.hidden {
        display: none;
      }
      .threat-alert.warn {
        background: rgba(180, 83, 9, 0.95);
        border-color: #fef08a;
        box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
      }
      .threat-alert.danger {
        background: rgba(159, 18, 57, 0.95);
        border-color: #fda4af;
        box-shadow: 0 0 30px rgba(225, 29, 72, 1.0);
      }
      @keyframes pulseThreat {
        from { transform: translateX(-50%) scale(1); }
        to { transform: translateX(-50%) scale(1.04); }
      }

      /* Modal de Mitosis Celular y Selección Taxonómica */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(3, 7, 18, 0.85);
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        animation: fadeIn 0.2s ease;
      }
      .modal-overlay.hidden {
        display: none;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .modal-box {
        background: #090e1c;
        border: 1px solid rgba(250, 204, 21, 0.4);
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(250, 204, 21, 0.2);
        width: 90%;
        max-width: 800px;
        padding: 24px;
        color: #f1f5f9;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 800;
        color: #fbbf24;
        letter-spacing: 0.5px;
      }
      .modal-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
      }
      .modal-close-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        transition: color 0.15s;
      }
      .modal-close-btn:hover {
        color: #ef4444;
      }
      .mutations-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 18px;
      }
      .mutation-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.2s ease;
      }
      .mutation-card:hover {
        border-color: #fbbf24;
        background: rgba(250, 204, 21, 0.05);
        transform: translateY(-2px);
      }
      .mutation-badge {
        font-size: 11px;
        font-weight: 700;
        color: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .mutation-name {
        font-size: 17px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .mutation-desc {
        font-size: 12px;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 14px;
      }
      .mutation-stats {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 16px;
        font-size: 12px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .stat-val.good {
        color: #10b981;
        font-weight: 700;
      }
      .stat-val.bad {
        color: #f59e0b;
        font-weight: 700;
      }
      .evolve-btn {
        width: 100%;
        background: linear-gradient(135deg, #d97706, #f59e0b);
        border: none;
        border-radius: 8px;
        padding: 10px;
        color: #ffffff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        transition: all 0.15s ease;
      }
      .evolve-btn:hover {
        background: linear-gradient(135deg, #b45309, #d97706);
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.7);
        transform: translateY(-1px);
      }

      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #94a3b8;
        font-size: 12px;
        background: rgba(6, 9, 19, 0.75);
        backdrop-filter: blur(6px);
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="telemetry-hud">
      <div class="hud-title">
        <span class="hud-badge"></span>
        Proyecto Bacteria: Etapa 3
      </div>
      <div class="hud-stat">
        <span class="hud-label">FPS:</span>
        <span id="fps-val" class="hud-value">--</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Física (Rapier WASM):</span>
        <span id="wasm-status" class="hud-value">Iniciando...</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Cursor Mundial:</span>
        <span id="coords-val" class="hud-value">(0.0, 0.0)</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Velocidad Célula:</span>
        <span id="speed-val" class="hud-value">0.0 u/s</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Masa Celular:</span>
        <span id="mass-val" class="hud-value">1.0 μg</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Tamaño / Escala:</span>
        <span id="scale-val" class="hud-value">1.00x</span>
      </div>
    </div>

    <div id="instructions">
      <b>W / Clic Der:</b> Nado &nbsp;|&nbsp; 
      <b>Clic Izq / Espacio:</b> Sprint Caza (ATP) &nbsp;|&nbsp; 
      <b>Contacto:</b> Engullir presas &nbsp;|&nbsp; 
      <b>[1-6]:</b> Bio-Mejoras &nbsp;|&nbsp; 
      <b>M:</b> Mitosis
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
