<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2310b981'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Bacteria - Etapa 0 (Fundación)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #060913;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #telemetry-hud {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #e2e8f0;
        background: rgba(6, 9, 19, 0.75);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.6;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .hud-title {
        font-weight: 700;
        font-size: 14px;
        color: #10b981;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hud-badge {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .hud-stat {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .hud-label {
        color: #94a3b8;
      }
      .hud-value {
        font-weight: 600;
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
      }
      #cellular-meters {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 10;
        pointer-events: none;
      }
      .meter-card {
        background: rgba(6, 9, 19, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 8px 14px;
        min-width: 170px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      }
      .meter-header {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .hp-card .meter-title { color: #10b981; }
      .shield-card .meter-title { color: #38bdf8; }
      .atp-card .meter-title { color: #fbbf24; }
      .meter-num {
        color: #f1f5f9;
        font-variant-numeric: tabular-nums;
      }
      .meter-track {
        width: 100%;
        height: 7px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .hp-fill {
        background: linear-gradient(90deg, #059669, #10b981);
        box-shadow: 0 0 8px #10b981;
      }
      .shield-fill {
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        box-shadow: 0 0 8px #38bdf8;
      }
      .atp-fill {
        background: linear-gradient(90deg, #d97706, #fbbf24);
        box-shadow: 0 0 10px #fbbf24;
      }

      /* Banner de Mitosis */
      .mitosis-alert {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(217, 119, 6, 0.9);
        border: 2px solid #fef08a;
        border-radius: 30px;
        padding: 6px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ffffff;
        font-size: 13px;
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
        animation: pulseMitosis 1.5s infinite alternate;
        z-index: 100;
        pointer-events: none;
      }
      .mitosis-alert.hidden {
        display: none;
      }
      @keyframes pulseMitosis {
        from { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.5); }
        to { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(250, 204, 21, 1); }
      }

      /* Panel Lateral de Bio-Upgrades */
      #bio-upgrades-panel {
        position: absolute;
        top: 175px;
        left: 16px;
        width: 220px;
        background: rgba(6, 9, 19, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(250, 204, 21, 0.25);
        border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      .upgrades-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #fbbf24;
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(250, 204, 21, 0.2);
      }
      .upgrades-hint {
        font-size: 10px;
        color: #94a3b8;
      }
      .upgrade-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        margin-bottom: 4px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        cursor: not-allowed;
        opacity: 0.5;
        transition: all 0.15s ease;
      }
      .upgrade-item.affordable {
        opacity: 1.0;
        cursor: pointer;
        border-color: rgba(250, 204, 21, 0.4);
        background: rgba(250, 204, 21, 0.08);
      }
      .upgrade-item.affordable:hover {
        background: rgba(250, 204, 21, 0.2);
        transform: translateX(2px);
      }
      .upgrade-item.maxed {
        opacity: 0.6;
        border-color: rgba(16, 185, 129, 0.3);
      }
      .upgrade-key {
        font-size: 11px;
        font-weight: 700;
        color: #fbbf24;
        width: 20px;
      }
      .upgrade-info {
        flex: 1;
      }
      .upgrade-name {
        font-size: 11px;
        font-weight: 600;
        color: #f1f5f9;
        line-height: 1.2;
      }
      .upgrade-pips {
        display: flex;
        gap: 3px;
        margin-top: 2px;
      }
      .pip {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.2);
      }
      .pip.active {
        background: #fbbf24;
        box-shadow: 0 0 5px #fbbf24;
      }
      .upgrade-cost {
        font-size: 10px;
        font-weight: 700;
        color: #fbbf24;
      }

      /* Textos flotantes de ATP */
      #floating-popups {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
        overflow: hidden;
      }
      .atp-popup {
        position: absolute;
        top: 50%;
        left: 50%;
        font-size: 15px;
        font-weight: 800;
        transform: translate(-50%, -50%);
        animation: floatUp 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      }
      @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
        20% { opacity: 1; transform: translate(-50%, -15px) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
      }

      #instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #94a3b8;
        font-size: 12px;
        background: rgba(6, 9, 19, 0.75);
        backdrop-filter: blur(6px);
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="telemetry-hud">
      <div class="hud-title">
        <span class="hud-badge"></span>
        Proyecto Bacteria: Etapa 2
      </div>
      <div class="hud-stat">
        <span class="hud-label">FPS:</span>
        <span id="fps-val" class="hud-value">--</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Física (Rapier WASM):</span>
        <span id="wasm-status" class="hud-value">Iniciando...</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Cursor Mundial:</span>
        <span id="coords-val" class="hud-value">(0.0, 0.0)</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Velocidad Célula:</span>
        <span id="speed-val" class="hud-value">0.0 u/s</span>
      </div>
    </div>

    <div id="instructions">
      <b>W / Clic Der:</b> Impulso &nbsp;|&nbsp; 
      <b>Clic Izq / Espacio:</b> Toxina (Lisis de Adipocitos) &nbsp;|&nbsp; 
      <b>[1-6]:</b> Bio-Mejoras &nbsp;|&nbsp; 
      <b>B:</b> Glóbulos Rojos
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
